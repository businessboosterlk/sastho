# Builds the Astro site and publishes dist/ to GitHub Pages on every push to main.
# The gate (scripts/check-site.mjs) and the click path (scripts/click-path.mjs) are run on the Mac before every
# push. They are not run here yet: the first publish on 29 Sep 2026 was made against the clock.
# SITE_URL and BASE_PATH are the ONLY things that change when the shop moves to the client's own domain.
# The catalogue is NOT pulled here. It is pulled on purpose with `npm run pull`, read, then committed,
# so a price never changes on the live shop without a person having seen it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://businessboosterlk.github.io
          BASE_PATH: /sastho
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
